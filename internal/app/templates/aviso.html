{{template "head" .}}
              <p style="margin:0 0 16px;">Hola <strong>{{v .NOMBRE}}</strong>,</p>
              <p style="margin:0 0 18px;">{{if t .AUTOR}}<strong>{{v .AUTOR}}</strong> publicó{{else}}Hay{{end}} un nuevo aviso{{if t .EQUIPO}} para <strong>{{v .EQUIPO}}</strong>{{end}}:</p>

              <table role="presentation" width="100%" cellpadding="0" cellspacing="0"
                     style="border:1px solid #cce9f7; border-left:5px solid {{v .PRIORIDAD_COLOR}}; border-radius:10px;">
                <tr>
                  <td style="padding:18px 20px;">
                    <span style="display:inline-block; padding:3px 10px; border-radius:999px; font-size:11px; font-weight:bold; letter-spacing:1px; text-transform:uppercase; color:#ffffff; background:{{v .PRIORIDAD_COLOR}};">{{v .PRIORIDAD}}</span>
                    <div style="margin:10px 0 8px; font-size:18px; font-weight:bold; color:#0f2a3d;">{{v .TITULO}}</div>
                    <div style="white-space:pre-wrap;">{{v .MENSAJE}}</div>
                  </td>
                </tr>
              </table>
{{if t .URL}}{{template "boton" .}}{{end}}
{{template "foot" .}}

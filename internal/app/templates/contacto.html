{{template "head" .}}
              <p style="margin:0 0 18px;">Recibiste un nuevo mensaje desde el formulario de contacto de <strong>{{v .EMPRESA}}</strong>.</p>

              <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="font-size:14px; border:1px solid #e6f4fb; border-radius:10px;">
                <tr>
                  <td style="padding:10px 14px; width:110px; color:#4f6b80; border-bottom:1px solid #e6f4fb;">Nombre</td>
                  <td style="padding:10px 14px; font-weight:bold; border-bottom:1px solid #e6f4fb;">{{v .NOMBRE}}</td>
                </tr>
                <tr>
                  <td style="padding:10px 14px; color:#4f6b80;">Correo</td>
                  <td style="padding:10px 14px;"><a href="mailto:{{v .EMAIL}}" style="color:#0075BE;">{{v .EMAIL}}</a></td>
                </tr>
              </table>

              <div style="margin:22px 0 8px; font-size:13px; font-weight:bold; letter-spacing:1px; text-transform:uppercase; color:#0075BE;">Mensaje</div>
              <div style="padding:16px 18px; background:#f4fafd; border-left:4px solid #359FD8; border-radius:8px; white-space:pre-wrap;">{{v .MENSAJE}}</div>

              <p style="margin:20px 0 0; font-size:13px; color:#4f6b80;">Responde directamente a este correo para contactar al remitente.</p>
{{template "foot" .}}
